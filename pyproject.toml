[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aurora-cycler-manager"
version = "0.11.6"
description = "Battery cycler management, data analysis and visualisation."
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "aurora-unicycler>=0.4.5",
    "battinfoconverter-backend>=3.2.0",
    "dash[diskcache]>=4.1.0",
    "dash_ag_grid>=33.3.3",
    "dash_bootstrap_components>=2.0.3",
    "dash_mantine_components>=2.6.1",
    "dash_resizable_panels>=0.1.0",
    "defusedxml>=0.7.1",
    "cryptography>=50.0.0",
    "fastnda>=1.1.0",
    "flask>=3.1.3",
    "h5py>=3.14.0",
    "numpy>=2.2.6",
    "orjson>=3.11.6",
    "pandas>=2.3.1",
    "paramiko>=3.5.1",
    "platformdirs>=4.3.8",
    "polars>=1.36.1",
    "pyarrow>=23.0.1",
    "python-calamine>=0.4.0",
    "scp>=0.15.0",
    "sqlalchemy>=2.0.46",
    "tables>=3.10.1",
    "msgpack>=1.2.1",  # required by tables, updated for security
    "tsdownsample>=0.1.4.1",
    "typing-extensions>=4.15.0",
    "tzlocal>=5.3.1",
    "waitress>=3.0.2",
    "xlsxwriter>=3.2.9",
    "xmltodict>=0.14.2",
    "yadg>=6.2.2,<7.0",
    "werkzeug>=3.1.9",
    "certifi>=2026.10.19",  # required by requests, updated for security
    "idna>=3.15",  # required by requests, updated for security
    "urllib3>=2.8.0",  # required by requests, updated for security
    "pynacl>=1.6.2",  # required by paramiko, updated for security
    "setuptools>=84.1.0",  # required by dash, updated for security
]

[project.optional-dependencies]
pg = [
    "psycopg2-binary>=2.9.11",
]

[dependency-groups]
dev = [
    "mkdocstrings[python]>=1.0.4",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "virtualenv>=21.14.9",
    "filelock>=4.2.1; python_version >= '3.11'",  # required by virtualenv, updated for security
    "zensical>=0.0.53",
]

[project.scripts]
aurora-setup = "aurora_cycler_manager.database_setup:main"
aurora-app = "aurora_cycler_manager.visualiser.startup:main"
aurora-daemon = "aurora_cycler_manager.daemon:main"

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.package-data]
"aurora_cycler_manager.visualiser" = ["assets/*"]

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "N803",
    "N806",
    "N815",
    "PLR2004",
    "TD002",
    "TD003",
    "D203",
    "D213",
    "COM812",
]
fix = true

[tool.ruff.extend-per-file-ignores]
"tests/*.py" = [
    "ANN001",  # Fixture params
    "ARG001",  # Unused arg in func
    "ARG002",  # Unused arg in method
    "S101",    # Asserts allowed in tests
    "PT011",   # Allow just checking for ValueError without match
]

[tool.mypy]
disable_error_code = ["import-untyped"]
exclude = [
    "test\\.py$", # files end with test.py
    "^test", # files that start with test
]
plugins = ["pydantic.mypy"]
